<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#0F172A" rx="16"/>
  <text x="36" y="48" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">03. MẸO NÂNG CẤP THẨM MỸ, CARD UI/UX, KHÔNG GIAN ÂM &amp; CHUYỂN ĐỘNG</text>
  <text x="36" y="74" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">9 mẹo sang xịn (85.1K) • Card Layout UI/UX (75.6K) • Không gian âm (59.6K) • Cảm giác chuyển động (30.8K)</text>
  <line x1="36" y1="90" x2="1164" y2="90" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(36,112)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">MẸO #01 — WATERMARK NUMBERING</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#F8FAFC"/><text x="42" y="106" fill="#E2E8F0" font-family="Arial" font-size="54" font-weight="800">01</text><text x="58" y="98" fill="#0F172A" font-family="Arial" font-size="16" font-weight="700">Bố cục (Composition)</text><text x="42" y="168" fill="#E2E8F0" font-family="Arial" font-size="54" font-weight="800">02</text><text x="58" y="160" fill="#0F172A" font-family="Arial" font-size="16" font-weight="700">Màu sắc (Color Theory)</text><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Phóng to số thứ tự màu nhạt đặt chìm phía sau tiêu đề</text></g>
  <g transform="translate(420,112)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">CARD #05 — TRÀN VIỀN (OVERFLOW)</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#F8FAFC"/><rect x="44" y="68" width="224" height="106" rx="16" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/><text x="64" y="104" fill="#0F172A" font-family="Arial" font-size="18" font-weight="800">Matcha Latte</text><text x="64" y="152" fill="#10B981" font-family="Arial" font-size="15" font-weight="700">49.000đ</text><circle cx="262" cy="86" r="36" fill="#15803D" stroke="#FFFFFF" stroke-width="4"/><text x="262" y="90" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">TRÀN VIỀN</text><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Đẩy sản phẩm vượt ra ngoài khung thẻ tạo chiều sâu 3D</text></g>
  <g transform="translate(804,112)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">CARD #04 — TICKET STACK UI</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#F8FAFC"/><rect x="64" y="54" width="232" height="20" rx="6" fill="#CBD5E1"/><rect x="48" y="66" width="264" height="110" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/><circle cx="48" cy="126" r="10" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/><circle cx="312" cy="126" r="10" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/><line x1="62" y1="126" x2="298" y2="126" stroke="#94A3B8" stroke-dasharray="5,4" stroke-width="2"/><text x="180" y="96" fill="#0F172A" font-family="Arial" font-size="18" font-weight="800" text-anchor="middle">LTH  -&gt;  HAN</text><text x="180" y="116" fill="#475569" font-family="Arial" font-size="11" text-anchor="middle">09:00 -&gt; 13:00 • HuJet VN5745</text><text x="180" y="156" fill="#0F172A" font-family="monospace" font-size="16" text-anchor="middle">||||| ||| |||| ||| |||||</text><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Mô phỏng vé thực tế: vết khuyết 2 bên + đường cắt + xếp lớp</text></g>
  <g transform="translate(36,364)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">CARD #03 — THẺ VÁT NGHIÊNG (SKEWED)</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#F8FAFC"/><polygon points="36,164 96,174 108,68 48,58" fill="#38BDF8" stroke="#0F172A"/><polygon points="112,164 172,174 184,68 124,58" fill="#A78BFA" stroke="#0F172A"/><polygon points="188,164 248,174 260,68 200,58" fill="#F59E0B" stroke="#0F172A"/><polygon points="264,164 324,174 336,68 276,58" fill="#10B981" stroke="#0F172A"/><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Thay thẻ chữ nhật đại trà bằng khối nghiêng + gradient + icon 3D</text></g>
  <g transform="translate(420,364)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#10B981" font-family="Arial" font-size="13" font-weight="700">KHÔNG GIAN ÂM (NEGATIVE SPACE)</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#F8FAFC"/><rect x="44" y="64" width="272" height="104" rx="10" fill="#F43F5E"/><text x="122" y="142" fill="#991B1B" font-family="Arial" font-size="78" font-weight="900" text-anchor="middle">D</text><text x="120" y="130" fill="#FFFFFF" font-family="Arial" font-size="38" font-weight="900" text-anchor="middle">I</text><text x="234" y="142" fill="#991B1B" font-family="Arial" font-size="78" font-weight="900" text-anchor="middle">O</text><text x="234" y="130" fill="#FFFFFF" font-family="Arial" font-size="38" font-weight="900" text-anchor="middle">T</text><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Lồng chữ I, T trắng vào khoảng trống của chữ D, O đỏ ("DO IT.")</text></g>
  <g transform="translate(804,364)"><rect width="360" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#F59E0B" font-family="Arial" font-size="13" font-weight="700">CẢM GIÁC CHUYỂN ĐỘNG (SPEED LINES)</text><rect x="16" y="42" width="328" height="148" rx="8" fill="#0F172A"/><rect x="32" y="62" width="180" height="6" rx="3" fill="#38BDF8" opacity="0.7"/><rect x="64" y="82" width="220" height="6" rx="3" fill="#38BDF8" opacity="0.5"/><rect x="40" y="148" width="240" height="6" rx="3" fill="#38BDF8" opacity="0.8"/><rect x="90" y="168" width="190" height="6" rx="3" fill="#38BDF8" opacity="0.4"/><text x="148" y="128" fill="#94A3B8" font-family="Arial" font-size="42" font-weight="900" font-style="italic" opacity="0.25">SPEED</text><text x="166" y="128" fill="#FFFFFF" font-family="Arial" font-size="42" font-weight="900" font-style="italic" opacity="0.5">SPEED</text><text x="184" y="128" fill="#F43F5E" font-family="Arial" font-size="42" font-weight="900" font-style="italic">SPEED</text><text x="180" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Chữ nghiêng lặp mờ dần + thanh tốc độ ngang chuyển sắc</text></g>
