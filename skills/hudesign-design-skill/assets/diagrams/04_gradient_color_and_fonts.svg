  <rect width="1200" height="600" fill="#0F172A" rx="16"/>
  <text x="36" y="48" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">04. LUẬT GRADIENT 90° / 180°, TƯƠNG PHẢN 4 LỚP &amp; 5 NHÓM FONT</text>
  <text x="36" y="74" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Gradient đúng cách (92.6K) • 5 mẹo phối màu (59.1K) • 5 Nhóm Font phổ biến</text>
  <line x1="36" y1="90" x2="1164" y2="90" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(36,112)"><rect width="552" height="456" rx="12" fill="#1E293B" stroke="#334155"/><text x="20" y="34" fill="#F59E0B" font-family="Arial" font-size="15" font-weight="700">QUY TẮC GRADIENT: KHỬ VÙNG XÁM (DEAD ZONE)</text><text x="20" y="72" fill="#F43F5E" font-family="Arial" font-size="12.5" font-weight="700">[SAI] 2 màu đối diện 180° (Tím -&gt; Xanh lá) tạo vùng xám xỉn ở giữa</text><rect x="20" y="84" width="512" height="48" rx="8" fill="url(#bad180)"/><text x="276" y="150" fill="#F43F5E" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">^ VÙNG XÁM XỈN (DEAD ZONE) ^</text><text x="20" y="186" fill="#10B981" font-family="Arial" font-size="12.5" font-weight="700">[CHUẨN 1] Chèn 1 điểm màu trung gian (Tím -&gt; Xanh dương -&gt; Xanh lá)</text><rect x="20" y="198" width="512" height="48" rx="8" fill="url(#fixMid)"/><text x="20" y="280" fill="#10B981" font-family="Arial" font-size="12.5" font-weight="700">[CHUẨN 2] Chọn 2 màu nằm trong góc &lt;= 90° (Cyan -&gt; Xanh dương đậm)</text><rect x="20" y="292" width="512" height="48" rx="8" fill="url(#good90)"/><rect x="20" y="362" width="512" height="76" rx="8" fill="#0F172A" stroke="#334155"/><text x="34" y="384" fill="#38BDF8" font-family="Arial" font-size="12" font-weight="700">TÁCH TƯƠNG PHẢN 4 LỚP UI (TRÁNH RỐI MÀU)</text><rect x="34" y="394" width="112" height="32" rx="6" fill="#CBD5E1"/><text x="90" y="414" fill="#0F172A" font-family="Arial" font-size="10.5" font-weight="700" text-anchor="middle">1. Nền tổng</text><rect x="158" y="394" width="112" height="32" rx="6" fill="#FFFFFF"/><text x="214" y="414" fill="#0F172A" font-family="Arial" font-size="10.5" font-weight="700" text-anchor="middle">2. Thẻ Card</text><rect x="282" y="394" width="112" height="32" rx="6" fill="#93C5FD"/><text x="338" y="414" fill="#0F172A" font-family="Arial" font-size="10.5" font-weight="700" text-anchor="middle">3. Khối phụ</text><rect x="406" y="394" width="112" height="32" rx="6" fill="#1D4ED8"/><text x="462" y="414" fill="#FFFFFF" font-family="Arial" font-size="10.5" font-weight="700" text-anchor="middle">4. Điểm nhấn</text></g>
  <g transform="translate(612,112)"><rect width="552" height="456" rx="12" fill="#1E293B" stroke="#334155"/><text x="20" y="34" fill="#38BDF8" font-family="Arial" font-size="15" font-weight="700">5 NHÓM FONT PHỔ BIẾN DESIGNER PHẢI NẮM</text><g transform="translate(20,52)"><rect width="512" height="68" rx="8" fill="#0F172A" stroke="#38BDF8"/><rect x="10" y="10" width="48" height="48" rx="6" fill="#38BDF8"/><text x="34" y="42" fill="#0F172A" font-family="Arial" font-size="22" font-weight="800" text-anchor="middle">Aa</text><text x="72" y="28" fill="#38BDF8" font-family="Arial" font-size="13" font-weight="700">1. SANS SERIF (Không chân)</text><text x="72" y="48" fill="#CBD5E1" font-family="Arial" font-size="11">Hiện đại, dễ đọc mọi thiết bị • Web, App, CV (Montserrat, Lato)</text></g><g transform="translate(20,130)"><rect width="512" height="68" rx="8" fill="#0F172A" stroke="#F59E0B"/><rect x="10" y="10" width="48" height="48" rx="6" fill="#F59E0B"/><text x="34" y="42" fill="#0F172A" font-family="Georgia, serif" font-size="22" font-weight="800" text-anchor="middle">Aa</text><text x="72" y="28" fill="#F59E0B" font-family="Arial" font-size="13" font-weight="700">2. SERIF (Có chân)</text><text x="72" y="48" fill="#CBD5E1" font-family="Arial" font-size="11">Cổ điển, sang trọng, đáng tin • Sách báo, Luật, Luxury (Georgia)</text></g><g transform="translate(20,208)"><rect width="512" height="68" rx="8" fill="#0F172A" stroke="#A78BFA"/><rect x="10" y="10" width="48" height="48" rx="6" fill="#A78BFA"/><text x="34" y="42" fill="#0F172A" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="700" text-anchor="middle">Aa</text><text x="72" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">3. SCRIPT (Viết tay)</text><text x="72" y="48" fill="#CBD5E1" font-family="Arial" font-size="11">Bay bướm, giàu cảm xúc • Thiệp mời, Poster nghệ thuật (Pacifico)</text></g><g transform="translate(20,286)"><rect width="512" height="68" rx="8" fill="#0F172A" stroke="#F43F5E"/><rect x="10" y="10" width="48" height="48" rx="6" fill="#F43F5E"/><text x="34" y="42" fill="#FFFFFF" font-family="Impact, Arial" font-size="22" font-weight="800" text-anchor="middle">AA</text><text x="72" y="28" fill="#F43F5E" font-family="Arial" font-size="13" font-weight="700">4. DISPLAY (Trang trí)</text><text x="72" y="48" fill="#CBD5E1" font-family="Arial" font-size="11">Độc lạ, hút mắt vài giây đầu • Poster, Banner, Bao bì (Bebas Neue)</text></g><g transform="translate(20,364)"><rect width="512" height="68" rx="8" fill="#0F172A" stroke="#10B981"/><rect x="10" y="10" width="48" height="48" rx="6" fill="#10B981"/><text x="34" y="42" fill="#0F172A" font-family="Courier New, serif" font-size="22" font-weight="900" text-anchor="middle">Aa</text><text x="72" y="28" fill="#10B981" font-family="Arial" font-size="13" font-weight="700">5. SLAB SERIF (Chân to bản)</text><text x="72" y="48" fill="#CBD5E1" font-family="Arial" font-size="11">Mạnh mẽ, cá tính • Retro, Quảng cáo, Công nghiệp (Roboto Slab)</text></g></g>
