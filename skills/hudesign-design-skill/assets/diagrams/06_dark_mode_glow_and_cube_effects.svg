  <g transform="translate(420,112)"><rect width="360" height="240" rx="12" fill="#1E293B" stroke="#334155"/><text x="16" y="28" fill="#A78BFA" font-family="Arial" font-size="13" font-weight="700">2. "THE CUBE" — MỀM CẠNH + GRAIN + "+"</text><rect x="16" y="42" width="328" height="156" rx="8" fill="#020617"/><circle cx="180" cy="120" r="68" fill="url(#cubeGlow)"/><rect x="142" y="82" width="76" height="76" rx="14" fill="#A855F7" opacity="0.85"/><text x="36" y="66" fill="#94A3B8" font-family="monospace" font-size="16">+</text><text x="316" y="66" fill="#94A3B8" font-family="monospace" font-size="16">+</text><text x="36" y="186" fill="#94A3B8" font-family="monospace" font-size="16">+</text><text x="316" y="186" fill="#94A3B8" font-family="monospace" font-size="16">+</text><text x="180" y="222" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Làm mờ phát sáng khối 3D + noise grain + dấu + ở 4 góc</text></g>
