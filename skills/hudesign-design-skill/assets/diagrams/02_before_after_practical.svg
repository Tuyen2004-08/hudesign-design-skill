<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#0F172A" rx="16"/>
  <text x="36" y="48" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">02. CÔNG THỨC TRƯỚC – SAU (BEFORE / AFTER): PROXIMITY, INFOGRAPHIC &amp; MENU</text>
  <text x="36" y="74" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Proximity (239.2K) • Infographic 7 bước (158.1K) • Menu Canva 3 tầng (168.2K) • Tỷ lệ vàng (65.2K)</text>
  <line x1="36" y1="90" x2="1164" y2="90" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(36,112)"><rect width="552" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="18" y="28" fill="#F8FAFC" font-family="Arial" font-size="14" font-weight="700">1. Nguyên tắc Gần kề — Proximity (Menu)</text><rect x="18" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#F43F5E" stroke-width="2"/><text x="135" y="62" fill="#F43F5E" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[TRƯỚC] Rời rạc 4 góc</text><text x="36" y="88" fill="#0F172A" font-family="Arial" font-size="11" font-weight="700">TÊN QUÁN</text><text x="160" y="118" fill="#0F172A" font-family="Arial" font-size="16" font-weight="800">MENU</text><text x="32" y="160" fill="#475569" font-family="Arial" font-size="10">SĐT: 09xx...</text><text x="136" y="180" fill="#475569" font-family="Arial" font-size="10">Địa chỉ quán...</text><text x="276" y="124" fill="#F59E0B" font-family="Arial" font-size="24" font-weight="800" text-anchor="middle">-&gt;</text><rect x="300" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/><text x="417" y="62" fill="#10B981" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[SAU] Gom nhóm ngữ nghĩa</text><rect x="332" y="74" width="170" height="52" rx="6" fill="#FEF3C7" stroke="#F59E0B"/><text x="417" y="94" fill="#475569" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle">TÊN QUÁN</text><text x="417" y="116" fill="#0F172A" font-family="Arial" font-size="18" font-weight="800" text-anchor="middle">MENU</text><rect x="342" y="140" width="150" height="38" rx="6" fill="#E2E8F0"/><text x="417" y="156" fill="#0F172A" font-family="Arial" font-size="9.5" text-anchor="middle">Địa chỉ • Giờ mở cửa</text><text x="417" y="170" fill="#475569" font-family="Arial" font-size="9.5" text-anchor="middle">Hotline: 09xx.xxx.xxx</text><text x="276" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Gom thông tin liên quan sát nhau + chừa khoảng thở rõ giữa các cụm</text></g>
  <g transform="translate(612,112)"><rect width="552" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="18" y="28" fill="#F8FAFC" font-family="Arial" font-size="14" font-weight="700">2. Infographic 7 bước chống "Toàn chữ"</text><rect x="18" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#F43F5E" stroke-width="2"/><text x="135" y="62" fill="#F43F5E" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[TRƯỚC] Dày đặc văn bản</text><rect x="34" y="76" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="92" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="108" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="124" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="140" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="156" width="200" height="8" rx="2" fill="#94A3B8"/><rect x="34" y="172" width="160" height="8" rx="2" fill="#94A3B8"/><text x="276" y="124" fill="#F59E0B" font-family="Arial" font-size="24" font-weight="800" text-anchor="middle">-&gt;</text><rect x="300" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/><text x="417" y="62" fill="#10B981" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[SAU] Ảnh tâm + 2 cột biểu đồ</text><rect x="330" y="70" width="174" height="16" rx="3" fill="#0F172A"/><circle cx="417" cy="122" r="24" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/><text x="417" y="125" fill="#0F172A" font-family="Arial" font-size="8.5" font-weight="700" text-anchor="middle">ẢNH TÂM</text><rect x="314" y="94" width="66" height="24" rx="4" fill="#DBEAFE" stroke="#38BDF8"/><rect x="314" y="124" width="66" height="28" rx="4" fill="#E2E8F0"/><rect x="454" y="94" width="66" height="24" rx="4" fill="#DCFCE7" stroke="#10B981"/><rect x="454" y="124" width="66" height="28" rx="4" fill="#FEF3C7" stroke="#F59E0B"/><circle cx="342" cy="172" r="9" fill="#0F172A"/><circle cx="392" cy="172" r="9" fill="#0F172A"/><circle cx="442" cy="172" r="9" fill="#0F172A"/><circle cx="492" cy="172" r="9" fill="#0F172A"/><line x1="351" y1="172" x2="483" y2="172" stroke="#F59E0B" stroke-width="2"/><text x="276" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Chia 2 cột -&gt; Ảnh trung tâm -&gt; Bar/Parabol chart -&gt; Quy trình mũi tên cuối trang</text></g>
  <g transform="translate(36,364)"><rect width="552" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="18" y="28" fill="#F8FAFC" font-family="Arial" font-size="14" font-weight="700">3. Tỷ lệ Vàng — Golden Ratio (1.618)</text><rect x="18" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#F43F5E" stroke-width="2"/><text x="135" y="62" fill="#F43F5E" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[TRƯỚC] Đặt tùy ý, mất cân đối</text><rect x="40" y="76" width="190" height="62" fill="#CBD5E1" stroke="#64748B"/><rect x="40" y="150" width="150" height="14" fill="#0F172A"/><rect x="40" y="170" width="100" height="10" fill="#64748B"/><text x="276" y="124" fill="#F59E0B" font-family="Arial" font-size="24" font-weight="800" text-anchor="middle">-&gt;</text><rect x="300" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/><text x="417" y="62" fill="#10B981" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[SAU] Theo ô chia &amp; đường xoắn ốc</text><rect x="314" y="72" width="124" height="110" fill="#1E293B" stroke="#F59E0B"/><text x="376" y="130" fill="#FFFFFF" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">CHỦ THỂ (Ô LỚN)</text><rect x="438" y="72" width="82" height="62" fill="#FEF3C7" stroke="#F59E0B"/><text x="479" y="106" fill="#0F172A" font-family="Arial" font-size="10" font-weight="700" text-anchor="middle">TIÊU ĐỀ</text><rect x="438" y="134" width="82" height="48" fill="#E2E8F0" stroke="#F59E0B"/><text x="479" y="162" fill="#475569" font-family="Arial" font-size="9.5" text-anchor="middle">MÔ TẢ</text><text x="276" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Chủ thể ở cung xoắn ốc lớn; Tiêu đề ô trên-phải; Mô tả + triện ô dưới-phải</text></g>
  <g transform="translate(612,364)"><rect width="552" height="228" rx="12" fill="#1E293B" stroke="#334155"/><text x="18" y="28" fill="#F8FAFC" font-family="Arial" font-size="14" font-weight="700">4. Menu 3 tầng tối giản trên Canva</text><rect x="18" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#F43F5E" stroke-width="2"/><text x="135" y="62" fill="#F43F5E" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[TRƯỚC] Danh sách dài phẳng</text><rect x="34" y="76" width="130" height="8" fill="#94A3B8"/><rect x="186" y="76" width="42" height="8" fill="#94A3B8"/><rect x="34" y="96" width="130" height="8" fill="#94A3B8"/><rect x="186" y="96" width="42" height="8" fill="#94A3B8"/><rect x="34" y="116" width="130" height="8" fill="#94A3B8"/><rect x="186" y="116" width="42" height="8" fill="#94A3B8"/><rect x="34" y="136" width="130" height="8" fill="#94A3B8"/><rect x="186" y="136" width="42" height="8" fill="#94A3B8"/><rect x="34" y="156" width="130" height="8" fill="#94A3B8"/><rect x="186" y="156" width="42" height="8" fill="#94A3B8"/><text x="276" y="124" fill="#F59E0B" font-family="Arial" font-size="24" font-weight="800" text-anchor="middle">-&gt;</text><rect x="300" y="44" width="234" height="148" rx="8" fill="#F8FAFC" stroke="#10B981" stroke-width="2"/><text x="417" y="62" fill="#10B981" font-family="Arial" font-size="11" font-weight="700" text-anchor="middle">[SAU] 3 tầng + dải màu + line 90°</text><rect x="312" y="70" width="210" height="34" fill="#FFFFFF" stroke="#CBD5E1"/><text x="322" y="91" fill="#0F172A" font-family="Arial" font-size="10" font-weight="700">menu • CÀ PHÊ</text><circle cx="496" cy="87" r="12" fill="#92400E"/><rect x="312" y="108" width="210" height="38" fill="#FEF08A" stroke="#F59E0B"/><circle cx="338" cy="127" r="13" fill="#10B981"/><text x="366" y="131" fill="#0F172A" font-family="Arial" font-size="10" font-weight="700">TRÀ (2 CỘT + LINE)</text><rect x="312" y="150" width="210" height="34" fill="#FFFFFF" stroke="#CBD5E1"/><text x="322" y="171" fill="#0F172A" font-family="Arial" font-size="10" font-weight="700">GIẢI KHÁT</text><circle cx="496" cy="167" r="12" fill="#F43F5E"/><text x="276" y="214" fill="#94A3B8" font-family="Arial" font-size="11" text-anchor="middle">Phủ dải màu nổi tầng giữa + xóa nền ảnh + đường kẻ mảnh 90° thẳng cột giá</text></g>
</svg>
